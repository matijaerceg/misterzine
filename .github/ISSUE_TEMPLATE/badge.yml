name: Propose a Hardware Verified badge
description: Nominate an arcade core that was built and checked against the real board or its schematics.
title: "[Hardware Verified] "
body:
  - type: markdown
    attributes:
      value: |
        Hardware Verified is the release tracker's seal for arcade cores built and checked against the real hardware: an owned or borrowed board, PAL or PROM dumps, the original schematics, logic analyzer or scope captures, or a write-up of how the logic was derived from the board. What it means and what counts: https://misterzine.fyi/badge/

        Evidence can come from anyone, not only the core's author: board owners, schematic holders and testers count too. It must cite something factual and checkable (a named board, a schematic set, a dump, a capture, a comparison write-up, a post describing the work); a bare claim that a core is accurate is not evidence. Every proposal is checked against its links before an entry is added.
  - type: input
    id: game
    attributes:
      label: Game
      description: The game as the release tracker lists it. A link to its row (the tracker's copy-link button) is perfect.
      placeholder: "Ghosts'n Goblins, or https://misterzine.fyi/releases/#gng"
    validations:
      required: true
  - type: input
    id: core
    attributes:
      label: Core and where it comes from
      description: The core's name or repository, and the database that ships it (MiSTer main distribution, Jotego, Coin-Op Collection, ...).
      placeholder: "jtgng, Jotego's jtcores"
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Evidence links
      description: One link per line, each to a public page describing the hardware work.
      placeholder: |
        https://github.com/...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What the links show
      description: A sentence or two in plain words, for example "The core was built from Capcom's original schematics and checked against a real board."
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Are you the core's author?
      options:
        - "No"
        - "Yes, this is my core"
    validations:
      required: false
